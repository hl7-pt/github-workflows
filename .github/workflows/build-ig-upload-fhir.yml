name: Build IG and upload resources to FHIR server

'on':
  workflow_call:
    inputs:
      fhir-server-url:
        description: FHIR server base URL (e.g. https://hapi.example.org/fhir). Upload is skipped if empty.
        type: string
        required: false
        default: ''
      tx-server:
        description: Terminology server URL
        type: string
        required: false
        default: ''
      java-version:
        type: string
        required: false
        default: '17'
      node-version:
        type: string
        required: false
        default: '24'
      dotnet-version:
        type: string
        required: false
        default: '8.0.x'
      artifact-name:
        type: string
        required: false
        default: ig-output
    secrets:
      FHIR_SERVER_TOKEN:
        description: Optional bearer token for the FHIR server
        required: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      FHIR_SERVER_URL: ${{ inputs.fhir-server-url }}
      TX_SERVER: ${{ inputs.tx-server }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - run: npm install -g fsh-sushi
      - run: |
          sudo apt-get update && sudo apt-get install -y ruby-full build-essential jq
          sudo gem install jekyll
      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl --fail --show-error --location https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar -o input-cache/publisher.jar
      - name: Build IG
        id: build
        run: |
          set -euo pipefail
          mkdir -p workflow-logs
          ./_genonce.sh 2>&1 | tee workflow-logs/build.log
      - uses: actions/setup-dotnet@v4
        id: dotnet
        if: env.FHIR_SERVER_URL != ''
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: Install UploadFIG
        id: install_uploadfig
        if: env.FHIR_SERVER_URL != ''
        run: dotnet tool install -g UploadFIG
      - name: Upload IG package (profiles, extensions, terminology and examples)
        id: uploadfig
        if: env.FHIR_SERVER_URL != ''
        env:
          # Keep the token out of build/setup steps. Never enable shell tracing.
          FHIR_SERVER_TOKEN: ${{ secrets.FHIR_SERVER_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p workflow-logs
          args=(-s output/package.tgz -d "$FHIR_SERVER_URL" -df json -r '*')
          if [ -n "$FHIR_SERVER_TOKEN" ]; then
            args+=(-dh "Authorization: Bearer $FHIR_SERVER_TOKEN")
          fi
          # Earlier attempts must not mark the job failed if a later one succeeds.
          for attempt in 1 2 3; do
            # Run the example transaction only after the first two passes failed.
            if [ "$attempt" -eq 3 ]; then
              echo "Running Ember fallback before UploadFIG attempt 3."
              if python3 - <<'EMBER_PYTHON'
          import json, os, re, subprocess, urllib.error, urllib.request
          from pathlib import Path
          
          folder = Path('workflow-logs')
          log = folder / 'ember.log'
          result = dict(status='failure', entries=0)
          token = os.environ.get('FHIR_SERVER_TOKEN', '')
          def redact(value):
              if token:
                  value = value.replace(token, '[REDACTED]')
              return re.sub(r'(?i)(authorization\s*:\s*bearer\s+)\S+', r'\1[REDACTED]', value)
          def record(message):
              with log.open('a') as stream:
                  stream.write(redact(str(message)) + '\n')
          
          # No redirect may forward the bearer token to another endpoint.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          try:
              # Ember 0.3.0 reads package/example; it does not recursively load dependencies.
              # Without serverBase it only generates a bundle and never contacts our FHIR server.
              package = Path('output/package.tgz').resolve()
              command = ['docker', 'run', '--rm', '--name', 'ig-ember-fallback',
                         '--mount', f'type=bind,src={package},dst=/input/package.tgz,readonly',
                         'jkiddo/ember:0.3.0', '--location=file:/input/package.tgz',
                         '--loadRecursively=false', '--includeSearchBundles=false',
                         '--spring.main.banner-mode=off', '--logging.pattern.console=%msg%n']
              generated = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                         text=True, timeout=300)
              record(generated.stdout)
              if generated.returncode:
                  raise RuntimeError(f'Ember generation exited with code {generated.returncode}')
              # Extract only a complete transaction Bundle from the mixed console output.
              decoder = json.JSONDecoder()
              bundles = []
              for match in re.finditer(r'^\s*\{', generated.stdout, re.M):
                  try:
                      candidate, _ = decoder.raw_decode(generated.stdout, match.end() - 1)
                  except ValueError:
                      continue
                  if isinstance(candidate, dict) and candidate.get('resourceType') == 'Bundle' and candidate.get('type') == 'transaction':
                      bundles.append(candidate)
              if len(bundles) != 1:
                  raise RuntimeError('Expected exactly one Ember transaction Bundle')
              bundle = bundles[0]
              entries = bundle.get('entry', [])
              result['entries'] = len(entries)
              if not entries:
                  result['status'] = 'skipped'
                  record('No examples found in package/example; proceeding to UploadFIG attempt 3.')
              else:
                  # 0.3.0 generates POST entries. Use stable IDs to avoid creating duplicates
                  # of examples already loaded by UploadFIG; keep fullUrl for cross-references.
                  identities = set()
                  for entry in entries:
                      resource = entry.get('resource', {})
                      kind, rid = resource.get('resourceType', ''), resource.get('id', '')
                      if not re.fullmatch(r'[A-Z][A-Za-z0-9]+', kind) or not re.fullmatch(r'[A-Za-z0-9.-]{1,64}', rid):
                          raise RuntimeError('Example has no valid resource type/ID; transaction was not sent')
                      identity = f'{kind}/{rid}'
                      if identity in identities:
                          raise RuntimeError(f'Duplicate example identity {identity}; transaction was not sent')
                      identities.add(identity)
                      entry['request'] = dict(method='PUT', url=identity)
                  # Save generated content after redaction; use original content for the request.
                  record('Sending transaction with ' + str(len(entries)) + ' PUT entries.')
                  headers = {'Content-Type': 'application/fhir+json', 'Accept': 'application/fhir+json'}
                  if token:
                      headers['Authorization'] = 'Bearer ' + token
                  request = urllib.request.Request(os.environ['FHIR_SERVER_URL'].rstrip('/'),
                              data=json.dumps(bundle).encode(), headers=headers, method='POST')
                  with urllib.request.build_opener(NoRedirect).open(request, timeout=120) as response:
                      body = response.read().decode('utf-8', errors='replace')
                      record(body)
                      payload = json.loads(body)
                  if payload.get('resourceType') != 'Bundle' or payload.get('type') != 'transaction-response':
                      raise RuntimeError('Server did not return a transaction-response Bundle')
                  responses = payload.get('entry', [])
                  if len(responses) != len(entries):
                      raise RuntimeError('Transaction response entry count does not match request')
                  for entry in responses:
                      status = entry.get('response', {}).get('status', '')
                      if not re.match(r'^2\d\d(?:\s|$)', status):
                          raise RuntimeError('Transaction contains an unsuccessful entry response')
                  result['status'] = 'success'
                  record('Ember transaction succeeded; proceeding to UploadFIG attempt 3.')
          except urllib.error.HTTPError as error:
              record(f'ERROR: Ember transaction HTTP {error.code}')
              record(error.read().decode('utf-8', errors='replace'))
          except Exception as error:
              record('ERROR: ' + str(error))
          finally:
              (folder / 'ember-results.json').write_text(json.dumps(result, indent=2) + '\n')
              print('Ember fallback: ' + result['status'] + '; see ember.log. Continuing with UploadFIG attempt 3.')
          EMBER_PYTHON
              then
                :
              else
                echo "Ember fallback could not complete; continuing with UploadFIG attempt 3."
              fi
            fi
            echo "UploadFIG attempt $attempt/3"
            log="workflow-logs/uploadfig-attempt-${attempt}.log"
            # Redact before tee: GitHub does not sanitize artifact files.
            # The conditional captures the pipeline status without disabling pipefail.
            if ~/.dotnet/tools/UploadFIG "${args[@]}" 2>&1 |
              python3 -u -c '
          import os, re, sys
          token = os.environ.get("FHIR_SERVER_TOKEN", "")
          for line in sys.stdin:
              if token:
                  line = line.replace(token, "[REDACTED]")
              line = re.sub(r"(?i)(authorization\s*:\s*bearer\s+)[^\s\"\x27]+", r"\1[REDACTED]", line)
              sys.stdout.write(line)
          ' | tee "$log"; then
              pipeline_exit=0
            else
              pipeline_exit=$?
            fi
            # Keep an alias of ONLY the latest attempt for the final parser/dashboard.
            cp "$log" workflow-logs/uploadfig.log
            printf '%s\t%s\n' "$attempt" "$pipeline_exit" >> workflow-logs/uploadfig-attempts.tsv
            if python3 - "$log" "$pipeline_exit" <<'PYTHON'
          import re, sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(errors="replace")
          text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", text).replace("\r", "\n")
          def last_total(label):
              values = re.findall(rf"^\s*{label}:\s*(\d+)\s*$", text, re.M)
              return int(values[-1]) if values else None
          totals = [last_total(label) for label in ("Success", "Failures", "Validation Errors")]
          diagnostic = re.search(
              r"^\s*(?:ERROR\b(?!S)(?:\s*:|\s+)|FATAL\s*:|Unhandled exception\b)",
              text, re.I | re.M)
          passed = (int(sys.argv[2]) == 0 and all(value is not None for value in totals)
                    and totals[1] == 0 and totals[2] == 0 and not diagnostic)
          raise SystemExit(0 if passed else 1)
          PYTHON
            then
              echo "UploadFIG completed without errors on attempt $attempt."
              exit 0
            fi
          done
          echo "UploadFIG still has errors after 3 attempts; see the final attempt log."
          exit 1

      - name: Parse UploadFIG results and check reported failures
        id: results
        if: ${{ always() }}
        env:
          UPLOAD_OUTCOME: ${{ steps.uploadfig.outcome }}
        run: |
          set -euo pipefail
          mkdir -p workflow-logs
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path

          folder = Path("workflow-logs")
          path = folder / "uploadfig.log"
          outcome = os.environ["UPLOAD_OUTCOME"]
          ran = outcome in ("success", "failure", "cancelled")
          exists = path.is_file()
          text = path.read_text(errors="replace") if exists else ""
          text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", text).replace("\r", "\n")
          lines = text.splitlines()
          counts = {key: None for key in ("created", "updated", "unchanged", "errors")}
          complete = False
          error_lines = 0
          if ran and exists:
              for key in ("created", "updated", "unchanged"):
                  # UploadFIG emits action-first lines, plus Resource/id unchanged.
                  pattern = rf"^\s*(?:{key}\s+\S+" + (
                      r"|[A-Z][A-Za-z0-9]*/\S+\s+unchanged(?:\s|$)" if key == "unchanged" else ""
                  ) + ")"
                  counts[key] = sum(bool(re.search(pattern, line)) for line in lines)
              def last_total(label):
                  matches = re.findall(rf"^\s*{label}:\s*(\d+)\s*$", text, re.M)
                  return int(matches[-1]) if matches else None
              failures = last_total("Failures")
              validation = last_total("Validation Errors")
              complete = all(last_total(label) is not None for label in
                             ("Success", "Failures", "Validation Errors",))
              error_lines = sum(bool(re.match(r"^\s*ERROR\s*:", line, re.I)) for line in lines)
              # Do not add ERROR lines to totals: they may describe the same failures.
              if failures is not None and validation is not None:
                  counts["errors"] = failures + validation
          # Capture diagnostic messages separately from the numeric totals.
          # Match actual diagnostics, not the final "Validation Errors: N" total.
          diagnostic = re.compile(
              r"^\s*(?:ERROR\b(?!S)(?:\s*:|\s+)|FATAL\s*:|Unhandled exception\b)", re.I)
          details = []
          seen = {}
          for number, line in enumerate(lines, 1):
              if not diagnostic.search(line):
                  continue
              message = line.strip()
              if message in seen:
                  seen[message]["occurrences"] += 1
                  continue
              item = dict(line=number, message=message[:2000], occurrences=1)
              seen[message] = item
              details.append(item)
          # Bound the dashboard and JSON size; the full redacted log is the artifact.
          detail_total = len(details)
          details = details[:20]
          attempts_path = folder / "uploadfig-attempts.tsv"
          attempts = []
          if attempts_path.is_file():
              for entry in attempts_path.read_text().splitlines():
                  number, code = entry.split("\t")
                  attempts.append(dict(attempt=int(number), pipeline_exit=int(code)))
          ember_path = folder / "ember-results.json"
          ember = json.loads(ember_path.read_text()) if ember_path.is_file() else dict(status="not_run", entries=0)
          data = dict(ember=ember, attempts=attempts, counts=counts, complete=complete, outcome=outcome,
                      explicit_error_lines=error_lines, log_present=exists,
                      error_details=details, unique_error_messages=detail_total)
          (folder / "uploadfig-results.json").write_text(json.dumps(data, indent=2) + "\n")
          if not exists:
              path.write_text("UploadFIG was not executed or produced no captured log.\n")
          # Some UploadFIG versions report errors while returning exit code zero.
          if ran and (not complete or (counts["errors"] or 0) > 0 or error_lines > 0 or detail_total > 0):
              print("::error::UploadFIG reported errors or its final summary is incomplete; inspect the log artifact.")
              raise SystemExit(1)
          PYTHON

      - name: Upload IG output and QA report as artifact
        id: ig_artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: output
          if-no-files-found: warn

      - name: Upload diagnostic logs (including on failure)
        id: log_artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-logs
          path: workflow-logs/
          if-no-files-found: warn

      - name: Write workflow summary
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DOTNET_OUTCOME: ${{ steps.dotnet.outcome }}
          INSTALL_OUTCOME: ${{ steps.install_uploadfig.outcome }}
          UPLOAD_OUTCOME: ${{ steps.uploadfig.outcome }}
          RESULTS_OUTCOME: ${{ steps.results.outcome }}
          IG_ARTIFACT_OUTCOME: ${{ steps.ig_artifact.outcome }}
          LOG_ARTIFACT_OUTCOME: ${{ steps.log_artifact.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import html, json, os
          from pathlib import Path

          path = Path("workflow-logs/uploadfig-results.json")
          data = json.loads(path.read_text()) if path.is_file() else {}
          outcome = os.environ["UPLOAD_OUTCOME"] or "skipped"
          counts = data.get("counts", {})
          complete = data.get("complete", False)
          if outcome == "skipped":
              reason = ("FHIR server URL is empty." if not os.environ.get("FHIR_SERVER_URL")
                        else "A preceding step failed, was cancelled or was skipped.")
              upload_status = "Skipped — " + reason
          elif outcome == "success" and os.environ["RESULTS_OUTCOME"] == "success":
              upload_status = "Success"
          else:
              upload_status = "Failure / cancelled — see step outcomes and logs."
          rows = ["## IG build and FHIR upload", "",
                  "**Job status:** " + os.environ["JOB_STATUS"],
                  "**UploadFIG:** " + upload_status,
                  "**Attempts executed:** " + str(len(data.get("attempts", []))) + " / 3",
                  "Counts and error details below refer only to the last executed attempt.", "",
                  "| Metric | Count |", "| --- | ---: |"]
          for key in ("created", "updated", "unchanged", "errors"):
              value = counts.get(key)
              rows.append(f"| {key} | {value if value is not None else 'N/A'} |")
          rows += ["", "Created/updated/unchanged count resource operation lines in the captured log.",
                   "Errors = final Failures + Validation Errors; ERROR lines are not added again.",
                   "Final UploadFIG totals present: " + ("yes" if complete else "no") + ".",
                   "If totals are absent, counts are partial observations; N/A means unavailable, not zero.",
                   "Explicit ERROR lines observed: " + str(data.get("explicit_error_lines", "N/A")),
                   "", "| Step | Outcome |", "| --- | --- |"]
          for name, key in (("Build", "BUILD_OUTCOME"), (".NET setup", "DOTNET_OUTCOME"),
                            ("Install UploadFIG", "INSTALL_OUTCOME"), ("UploadFIG", "UPLOAD_OUTCOME"),
                            ("Result checks", "RESULTS_OUTCOME"), ("IG artifact", "IG_ARTIFACT_OUTCOME"),
                            ("Log artifact", "LOG_ARTIFACT_OUTCOME")):
              rows.append(f"| {name} | {os.environ.get(key) or 'skipped'} |")
          attempts = data.get("attempts", [])
          if attempts:
              rows += ["", "### Upload attempts", "",
                       "| Attempt | Pipeline exit code | Log |", "| --- | ---: | --- |"]
              for item in attempts:
                  rows.append(f"| {item['attempt']} | {item['pipeline_exit']} | "
                              f"uploadfig-attempt-{item['attempt']}.log |")
              rows += ["", "A zero exit code alone does not imply success: reported errors and "
                       "missing final totals also trigger another attempt."]
          ember = data.get("ember", {"status": "not_run", "entries": 0})
          rows += ["", "### Ember fallback (between attempts 2 and 3)", "",
                   "Status: " + ember["status"] + "; example entries: " + str(ember["entries"]) + ".",
                   "Ember reads package/example and submits a transaction with stable IDs (PUT).",
                   "If no examples are present there, Ember skips submission. See ember.log when executed.",
                   "The final upload status and counts remain those of the last UploadFIG attempt."]
          rows += ["", "### UploadFIG error details (last attempt)", ""]
          details = data.get("error_details", [])
          if details:
              rows.append("Messages extracted from uploadfig.log (line numbers refer to that artifact).")
              for index, item in enumerate(details, 1):
                  # Treat log text as untrusted: prevent HTML/Markdown injection.
                  message = html.escape(item["message"])
                  rows += ["", "<details>",
                           f"<summary>Error {index} — log line {item['line']} "
                           f"({item['occurrences']} occurrence(s))</summary>", "",
                           "<pre>" + message + "</pre>", "", "</details>"]
              total = data.get("unique_error_messages", len(details))
              if total > len(details):
                  rows += ["", f"Showing the first {len(details)} of {total} distinct error messages; "
                                   f"{total - len(details)} omitted. See the log artifact for the full list."]
              rows += ["", "Messages are limited to 2000 characters each; see the log artifact for full context."]
          elif outcome == "skipped":
              rows.append("No upload errors to list: UploadFIG was not executed.")
          elif not data.get("log_present"):
              rows.append("Error details unavailable: no captured UploadFIG log.")
          elif not complete or (counts.get("errors") or 0) > 0 or outcome != "success":
              rows.append("No recognized error messages found. The upload failed, was cancelled, or "
                          "has incomplete totals; inspect the full log artifact for details.")
          else:
              rows.append("No recognized error messages found in the captured log.")
          if os.environ.get("BUILD_OUTCOME") == "failure":
              rows += ["", "The IG build failed; inspect build.log in the log artifact."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(rows) + "\n")
          PYTHON
